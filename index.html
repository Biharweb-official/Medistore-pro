<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bihar Medistore Pro - Retail & Wholesale POS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="navbar">
    <div class="logo">
      <h2>💊 Medistore Pro</h2>
      <span class="badge">Bihar SaaS Edition</span>
    </div>
    <nav class="nav-links">
      <button class="mode-btn active" id="btnRetail">Retailer Mode</button>
      <button class="mode-btn" id="btnWholesale">Wholeseller Mode</button>
      <button class="btn-login" onclick="alert('Login System Ready!')">Login / Account</button>
    </nav>
  </header>

  <!-- Keyboard Shortcuts Helper Bar -->
  <div class="shortcut-bar">
    <span>⚡ <b>Fast POS Keys:</b></span>
    <span class="key">F3: Search Focus</span>
    <span class="key">F2: Clear Bill</span>
    <span class="key">Alt + P: Print Invoice</span>
  </div>

  <!-- Main Work Area -->
  <main class="container">
    <!-- Top Search & Quick Stats -->
    <section class="pos-header">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="F3 dabayein - Medicine name ya Generic composition search karein (e.g. Dolo, Paracetamol)...">
      </div>
      <div class="quick-stats">
        <div class="stat-card">
          <small>Total Medicines</small>
          <strong id="totalStockCount">0</strong>
        </div>
      </div>
    </section>

    <!-- Main Layout: Medicine List + Quick Counter Bill -->
    <div class="main-layout">
      <!-- Left: Medicine Cards Grid -->
      <section id="medicineList" class="grid"></section>

      <!-- Right: Fast Billing Counter -->
      <aside class="cart-panel">
        <h3>🧾 Quick Billing Counter</h3>
        <div id="cartItems" class="cart-list">
          <p class="empty-msg">Koi medicine select nahi hui hai.</p>
        </div>
        <div class="cart-footer">
          <div class="total-row">
            <span>Total Payable:</span>
            <strong id="cartTotal">₹0.00</strong>
          </div>
          <button class="btn-print" onclick="printBill()">🖨️ Print & Send WhatsApp Bill</button>
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer with Abinash Singh Branding -->
  <footer class="footer">
    <p>&copy; 2026 Bihar Medistore Pro. All Rights Reserved.</p>
    <p class="designer-tag">Designed by <span>Abinash Singh</span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
