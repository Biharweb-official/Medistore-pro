<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bihar Medistore Pro - SaaS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Navigation -->
  <header class="navbar">
    <div class="logo">
      <h2>💊 Medistore Pro</h2>
      <span class="badge">Bihar SaaS Edition</span>
    </div>
    <nav class="nav-links">
      <a href="#features">Features</a>
      <a href="#saas">SaaS Plans</a>
      <button class="btn-login" onclick="alert('Login system coming soon!')">Login</button>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container">
    <section class="hero-section">
      <h1>Bihar General & Generic Medicine Directory</h1>
      <p>Search over 10,000+ medicines available across Bihar medical stores.</p>
      
      <!-- Search Input -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Medicine name ya generic composition search karein (e.g. Dolo, Paracetamol)...">
      </div>
    </section>

    <!-- Medicine Cards Grid -->
    <section id="medicineList" class="grid">
      <!-- Dynamic Data JavaScript se yahan load hoga -->
    </section>
  </main>

  <!-- Footer with Branding -->
  <footer class="footer">
    <p>&copy; 2026 Bihar Medistore Pro. All Rights Reserved.</p>
    <p class="designer-tag">Designed by <span>Abinash Singh</span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
